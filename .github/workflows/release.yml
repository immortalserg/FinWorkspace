name: Release

# Push a tag like v1.2.0 (or v1.3.0-rc1 for a pre-release) to publish a
# multi-arch image to GitHub Container Registry and create a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify version and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in the code
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"   # 1.3.0-rc1 -> 1.3.0
          py=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          cfg=$(grep -m1 'APP_VERSION: str' backend/app/config.py | cut -d'"' -f2)
          js=$(grep -m1 '"version"' frontend/app/package.json | cut -d'"' -f4)
          echo "tag=$base pyproject=$py config=$cfg package.json=$js"
          for v in "$py" "$cfg" "$js"; do
            if [ "$v" != "$base" ]; then
              echo "::error::Version mismatch. Bump pyproject.toml, backend/app/config.py (APP_VERSION) and frontend/app/package.json to $base, then re-tag."
              exit 1
            fi
          done
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group dev --locked
      - name: Backend tests
        env:
          DEBUG: "true"
        run: uv run pytest backend/tests -q

  publish:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/finworkspace
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version's changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md for details." > release-notes.md
          {
            echo
            echo "### Docker image"
            echo '```bash'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${v}"
            echo '```'
          } >> release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
