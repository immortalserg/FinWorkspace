name: Publish FinWorkspace mobile-auth image

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-mobile-auth.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/immortalserg/finworkspace:mobile-auth-1
          labels: |
            org.opencontainers.image.source=https://github.com/immortalserg/FinWorkspace
