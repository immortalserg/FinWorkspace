name: Generate web brand icons

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/app/public/assets/icons/finworkspace.svg'
      - '.github/workflows/brand-icons.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render web icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          cd frontend/app/public/assets/icons
          for size in 32 192 512; do
            rsvg-convert -w "$size" -h "$size" finworkspace.svg > "finworkspace-$size.png"
          done
      - name: Commit icons
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/app/public/assets/icons/finworkspace-*.png
          if ! git diff --cached --quiet; then
            git commit -m "Render FinWorkspace website PNG icons"
            git push
          fi
