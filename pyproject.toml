[project]
name = "personalfinance"
version = "1.3.3"
description = "Self-hosted household finance: accounts, budgets, debts, goals, bank sync, investments and an AI advisor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10",
    "cryptography>=50.0.1",
    "pywebpush>=2.5.0",
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.1",
    "statsmodels>=0.15.0",
    "uvicorn>=0.54.0",
    "tradernet-sdk>=2.2.0",
    "yfinance>=1.7.0",
    "python-binance>=1.0.29",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "fpdf2>=2.8.9",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"
