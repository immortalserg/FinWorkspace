services:
  app:
    # Prebuilt multi-arch image (amd64 + arm64) published by the release
    # workflow. `docker compose pull` fetches it; pin a release with
    # FINWORKSPACE_IMAGE_TAG=1.0.0 in .env. `docker compose up --build` builds from this
    # checkout instead and tags the result with the same name.
    image: ghcr.io/immortalserg/finworkspace:${FINWORKSPACE_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finworkspace-app
    ports:
      # Frontend is served by the backend itself (same origin) — only one port
      # to publish, which is also what Tailscale Funnel expects.
      #
      # Published on loopback only: `tailscale funnel`/`serve` runs on the host
      # and reaches it over 127.0.0.1, while nothing off-box can hit the port
      # directly. That is what makes TRUST_PROXY_HEADERS=true safe — otherwise
      # anyone reaching the port could spoof X-Forwarded-For past the rate
      # limiter. Set BIND_ADDRESS=0.0.0.0 to expose it on the LAN/tailnet
      # directly, and then set TRUST_PROXY_HEADERS=false.
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8223}:${BACKEND_PORT:-8223}"
    # The app reads its settings as environment variables INSIDE the container —
    # it never sees the host's .env file. Forward the whole file rather than
    # enumerating keys: an enumerated list silently drops every setting someone
    # forgets to add, which is how NOTIFICATION_ENCRYPTION_KEY, ADMIN_EMAILS,
    # PUBLIC_BASE_URL, TRUST_PROXY_HEADERS, SMTP_* and VAPID_* all went missing.
    env_file:
      - .env
    environment:
      # Only vars that need a fallback when absent from .env.
      - BACKEND_PORT=${BACKEND_PORT:-8223}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - AI_DEFAULT_MODEL=${AI_DEFAULT_MODEL:-deepseek/deepseek-chat-v3.1}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-4096}
      - AI_TURN_COST_CAP_USD=${AI_TURN_COST_CAP_USD:-0.25}
      - AI_FALLBACK_PRICE_IN_PER_M=${AI_FALLBACK_PRICE_IN_PER_M:-1.0}
      - AI_FALLBACK_PRICE_OUT_PER_M=${AI_FALLBACK_PRICE_OUT_PER_M:-4.0}
      # OPENROUTER_API_KEY and the optional AI_MONTHLY_CAP_USD arrive via env_file.
      # AI_MONTHLY_CAP_USD is deliberately NOT listed here: compose would pass an
      # empty string when unset, which fails float parsing. Set it in .env only
      # when you want a cap.
      - AI_CHAT_MAX_TOOL_ROUNDS=${AI_CHAT_MAX_TOOL_ROUNDS:-10}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # Enable Banking private key, mounted read-only rather than baked into the
      # image. Set EB_PRIVATE_KEY_PATH=/app/secrets/enablebanking.pem in .env to
      # match. Harmless when the directory doesn't exist and bank sync is off.
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${BACKEND_PORT:-8223}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data:
    driver: local
